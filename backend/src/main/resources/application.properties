spring.application.name=stayease-hotel
server.port=${PORT:4040}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stayease_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# JWT (set a real Base64 secret via env in production)
app.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTAxMjM0NTY3ODk=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# CORS (comma separated list of allowed frontend origins)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:7070,http://localhost}

# Room photo storage (local disk, served from /uploads)
app.upload-dir=${UPLOAD_DIR:./uploads}
app.public-url=${PUBLIC_URL:http://localhost:4040}

# First admin account, created on startup if it does not exist
app.admin.email=${ADMIN_EMAIL:admin@stayease.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Health check endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
